services:
  redis-test:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-test:
    image: postgres:16-alpine
    ports: ["15432:5432"]
    environment:
      POSTGRES_DB: trpc_agent_test
      POSTGRES_USER: trpc_agent
      POSTGRES_PASSWORD: test
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trpc_agent -d trpc_agent_test"]
      interval: 2s
      timeout: 2s
      retries: 30
