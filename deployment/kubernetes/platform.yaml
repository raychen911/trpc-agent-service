---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: trpc-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: trpc-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trpc-agent-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: trpc-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trpc-agent-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: durable-outbox-worker
  namespace: trpc-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trpc-agent-durable-outbox
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: trpc-agent
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agent.example.com
      secretName: trpc-agent-tls
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app: trpc-agent-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        # Replace 0.0.0.0/0 with the approved CIDRs for model, IM, vector,
        # object-storage and telemetry endpoints in production.
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Workers consume the shared queue and call storage, telemetry, model and
# tool endpoints. Keep the selector explicit so a default-deny policy can be
# added for the namespace without accidentally exposing the worker pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app: trpc-agent-worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trpc-agent-gateway
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
