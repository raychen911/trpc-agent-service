        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: outbound-egress
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app: trpc-agent-outbound
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: trpc-agent
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: trpc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trpc-agent-otel
  template:
    metadata:
      labels:
        app: trpc-agent-otel
    spec:
      serviceAccountName: trpc-agent
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector:0.103.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: trpc-agent
spec:
  selector:
    app: trpc-agent-otel
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-ingress
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app: trpc-agent-otel
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trpc-agent-gateway
        - podSelector:
            matchLabels:
              app: trpc-agent-worker
        - podSelector:
            matchLabels:
              app: trpc-agent-compensation
        - podSelector:
            matchLabels:
              app: trpc-agent-durable-outbox
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trpc-agent-gateway
        - podSelector:
            matchLabels:
              app: trpc-agent-worker
        - podSelector:
            matchLabels:
              app: trpc-agent-compensation
        - podSelector:
            matchLabels:
              app: trpc-agent-outbound
        - podSelector:
            matchLabels:
              app: trpc-agent-durable-outbox
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trpc-agent-gateway
        - podSelector:
            matchLabels:
              app: trpc-agent-worker
        - podSelector:
            matchLabels:
              app: trpc-agent-compensation
        - podSelector:
            matchLabels:
              app: trpc-agent-outbound
        - podSelector:
            matchLabels:
              app: trpc-agent-durable-outbox
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: durable-outbox-egress
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app: trpc-agent-durable-outbox
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4318
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
