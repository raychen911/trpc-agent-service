          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailbox-maintenance
  namespace: trpc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
