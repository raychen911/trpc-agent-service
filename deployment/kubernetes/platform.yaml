apiVersion: v1
kind: Namespace
metadata:
  name: trpc-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trpc-agent
  namespace: trpc-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-agent-config
  namespace: trpc-agent
data:
  PYTHONPATH: /app
  DEFAULT_SESSION_BACKEND: redis
  DEFAULT_MEMORY_BACKEND: postgres
  DEFAULT_SUMMARY_BACKEND: postgres
  DEFAULT_KNOWLEDGE_BACKEND: remote
  DEFAULT_ARTIFACT_BACKEND: s3
  DEFAULT_AUDIT_BACKEND: postgres
  SYNC_DEMO_DEFAULT_STORAGE: "1"
  OBJECT_REGION: us-east-1
  OBJECT_BUCKET: trpc-agent-prod
  REQUIRE_SHARED_COORDINATION: "1"
  WORKER_QUEUE_TRANSPORT: streams
  WORKER_STREAM_GROUP: workers
  DURABLE_INBOX_OUTBOX: "1"
  SESSION_READY_ASYNC: "1"
  SESSION_READY_STREAM: trpc-agent:session-ready:stream
  SESSION_READY_GROUP: session-workers
  INBOX_LEASE_SECONDS: "180"
  SESSION_LEASE_TTL_SECONDS: "120"
  REQUIRE_ETAG: "1"
  DURABLE_OUTBOX_SINK_URL: redis://redis:6379/0
  DURABLE_OUTBOX_STREAM: trpc-agent:outbox:events
  DURABLE_OUTBOX_MAX_ATTEMPTS: "10"
  COMPENSATION_REPLAY_LIMIT: "100"
  COMPENSATION_INTERVAL_SECONDS: "5"
  POSTGRES_RLS_ENABLED: "1"
  POSTGRES_AUTO_CREATE_SCHEMA: "0"
  POSTGRES_RLS_APP_ROLE: trpc_agent_app
  POSTGRES_RLS_ADMIN_ROLE: trpc_agent_admin
  POSTGRES_RLS_WORKER_ROLE: trpc_worker
  OTEL_SERVICE_NAME: trpc-agent
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_EXPORTER: otlp
  PUBLIC_SURFACE_AUTH_REQUIRED: "1"
  OUTBOUND_QUEUE_ENABLED: "1"
---
# Requires External Secrets Operator and a ClusterSecretStore named
# "platform-secrets". No credentials are stored in this manifest.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trpc-agent-secrets
  namespace: trpc-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: trpc-agent-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: prod/trpc-agent/REDIS_URL
    - secretKey: WORKER_QUEUE_URL
      remoteRef:
        key: prod/trpc-agent/WORKER_QUEUE_URL
    - secretKey: OUTBOUND_QUEUE_URL
      remoteRef:
        key: prod/trpc-agent/OUTBOUND_QUEUE_URL
    - secretKey: POSTGRES_DSN
      remoteRef:
        key: prod/trpc-agent/POSTGRES_DSN
    - secretKey: TENANT_DB_DSN
      remoteRef:
        key: prod/trpc-agent/TENANT_DB_DSN
    - secretKey: ADMIN_API_KEY
      remoteRef:
        key: prod/trpc-agent/ADMIN_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: prod/trpc-agent/OPENAI_API_KEY
    - secretKey: POSTGRES_WORKER_DSN
      remoteRef:
        key: prod/trpc-agent/POSTGRES_WORKER_DSN
    - secretKey: VECTOR_TOKEN_REF
      remoteRef:
        key: prod/trpc-agent/VECTOR_TOKEN_REF
    - secretKey: OBJECT_ACCESS_KEY_REF
      remoteRef:
        key: prod/trpc-agent/OBJECT_ACCESS_KEY_REF
    - secretKey: OBJECT_SECRET_KEY_REF
      remoteRef:
        key: prod/trpc-agent/OBJECT_SECRET_KEY_REF
---
# Migration credentials are intentionally separate from the runtime Secret.
# Only the schema migration Job should receive this Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trpc-agent-migration-secrets
  namespace: trpc-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: trpc-agent-migration-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_SCHEMA_DSN
      remoteRef:
        key: prod/trpc-agent/POSTGRES_SCHEMA_DSN
    - secretKey: POSTGRES_RLS_APP_PASSWORD
      remoteRef:
        key: prod/trpc-agent/POSTGRES_RLS_APP_PASSWORD
    - secretKey: POSTGRES_RLS_ADMIN_PASSWORD
      remoteRef:
        key: prod/trpc-agent/POSTGRES_RLS_ADMIN_PASSWORD
    - secretKey: POSTGRES_RLS_WORKER_PASSWORD
      remoteRef:
        key: prod/trpc-agent/POSTGRES_RLS_WORKER_PASSWORD
---
apiVersion: batch/v1
kind: Job
metadata:
  name: trpc-agent-schema-migration
  namespace: trpc-agent
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: trpc-agent-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: trpc-agent
      containers:
        - name: schema-migration
          image: trpc-agent-service:release
          command: ["/bin/sh", "-ec"]
          args:
            - |
              trpc-agent-migrate db upgrade --sql-dsn "$POSTGRES_SCHEMA_DSN"
              trpc-agent-migrate db check --sql-dsn "$POSTGRES_SCHEMA_DSN"
              python -m trpc_service.migrate rls --sql-dsn "$POSTGRES_SCHEMA_DSN" \
                --app-role "$POSTGRES_RLS_APP_ROLE" \
                --admin-role "$POSTGRES_RLS_ADMIN_ROLE"
          envFrom:
            - configMapRef:
                name: trpc-agent-config
            - secretRef:
                name: trpc-agent-migration-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: trpc-agent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: trpc-agent-gateway
  template:
    metadata:
      labels:
        app: trpc-agent-gateway
    spec:
      serviceAccountName: trpc-agent
      containers:
        - name: gateway
          image: trpc-agent-service:release
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "trpc_service.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: trpc-agent-config
            - secretRef:
                name: trpc-agent-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: trpc-agent
spec:
  selector:
    app: trpc-agent-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: trpc-agent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: trpc-agent-worker
  template:
    metadata:
      labels:
        app: trpc-agent-worker
    spec:
      serviceAccountName: trpc-agent
      containers:
        - name: worker
          image: trpc-agent-service:release
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "trpc_service._cli", "worker"]
          env:
            - name: POSTGRES_PROCESS_ROLE
              value: worker
            - name: WORKER_COUNT
              value: "2"
            - name: OTEL_SERVICE_NAME
              value: trpc-agent-worker
          envFrom:
            - configMapRef:
                name: trpc-agent-config
            - secretRef:
                name: trpc-agent-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compensation-worker
  namespace: trpc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trpc-agent-compensation
  template:
    metadata:
      labels:
        app: trpc-agent-compensation
    spec:
      serviceAccountName: trpc-agent
      containers:
        - name: compensation-worker
          image: trpc-agent-service:release
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "trpc_service._cli", "compensate", "--limit", "100", "--interval", "5"]
          env:
            - name: OTEL_SERVICE_NAME
              value: trpc-agent-compensation
          envFrom:
            - configMapRef:
                name: trpc-agent-config
            - secretRef:
                name: trpc-agent-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-ready-worker
  namespace: trpc-agent
spec:
