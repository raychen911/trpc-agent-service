      containers:
        - name: mailbox-maintenance
          image: trpc-agent-service:release
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "trpc_service._cli", "mailbox-maintenance", "--limit", "100", "--interval", "5"]
          env:
            - name: OTEL_SERVICE_NAME
              value: trpc-agent-mailbox-maintenance
          envFrom:
            - configMapRef:
                name: trpc-agent-config
            - secretRef:
                name: trpc-agent-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbound-worker
  namespace: trpc-agent
spec:
