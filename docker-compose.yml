services:
  postgres:
    image: pgvector/pgvector:pg16
    # This private file contains only the bootstrap and per-workload database
    # passwords.  It is required: the former trpc bootstrap superuser must
    # never be used by application processes.
    env_file:
      - path: .db-bootstrap.env
        required: true
    environment:
      POSTGRES_DB: trpc_agent
    # Keep stateful services off the public interface.  Use the Docker network
    # from application containers; operators can tunnel localhost for recovery.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init/00-create-workload-roles.sh:/docker-entrypoint-initdb.d/00-create-workload-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${TRPC_DB_BOOTSTRAP_USER:-$${POSTGRES_USER:-postgres}} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  migrate:
    build: .
    command: python -m trpc_service._cli migrate
    env_file:
      - path: .migrator.env
        required: true
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    command: python -m trpc_service._cli api
    env_file:
      - path: .api.env
        required: true
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: python -m trpc_service._cli worker --no-once
    env_file:
      - path: .worker.env
        required: true
    volumes:
      - storage-profiles:/var/lib/trpc-storage
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  dispatcher:
    build: .
    command: python -m trpc_service._cli dispatcher --no-once
    env_file:
      - path: .dispatcher.env
        required: true
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  wecom-aibot:
    build: .
    # This singleton owns each Bot ID's one permitted outbound WebSocket and
    # consumes Smart Bot replies in its own Redis consumer group.
    command: python -m trpc_service._cli wecom-aibot --no-once
    # The file is deliberately not committed.  When present it should contain
    # only TRPC_LIVE_WECOM_AIBOT_SECRET and be mode 0600.
    env_file:
      - path: .wecom-aibot-runtime.env
        required: true
      - path: .wecom-aibot.env
        required: false
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

volumes:
  postgres-data:
  redis-data:
  storage-profiles:
  minio-data:
