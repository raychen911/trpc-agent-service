apiVersion: v1
kind: ConfigMap
metadata:
  name: backlog-metric-source
  namespace: trpc-runtime-support
data:
  source.py: |
    import http.server
    import json
    import ssl
    import urllib.parse
    import urllib.request

    API = "https://kubernetes.default.svc"
    TOKEN = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    OWNER = "trpc.io/managed-by=trpc-kubernetes-runtime-gate"
    LOAD = "trpc.io/hpa-gate=bounded-job-driver,trpc.io/hpa-phase=load"

    def api(path):
        with open(TOKEN, encoding="utf-8") as handle:
            token = handle.read().strip()
        request = urllib.request.Request(API + path)
        request.add_header("Authorization", "Bearer " + token)
        context = ssl.create_default_context(cafile=CA)
        with urllib.request.urlopen(request, context=context, timeout=5) as response:
            return json.load(response)

    def snapshot():
        namespaces = api("/api/v1/namespaces?labelSelector=" + urllib.parse.quote(OWNER, safe=""))
        jobs = api("/apis/batch/v1/jobs?labelSelector=" + urllib.parse.quote(LOAD, safe=""))
        active = {
            item.get("metadata", {}).get("namespace")
            for item in jobs.get("items", [])
            if item.get("metadata", {}).get("namespace")
        }
        names = sorted(
            item.get("metadata", {}).get("name")
            for item in namespaces.get("items", [])
            if item.get("metadata", {}).get("name")
        )
        lines = [
            "# HELP trpc_session_ready_backlog Bounded acceptance backlog.",
            "# TYPE trpc_session_ready_backlog gauge",
        ]
        for name in names:
            value = 40 if name in active else 0
            lines.append('trpc_session_ready_backlog{namespace=' + json.dumps(name) + '} ' + str(value))
        return "\n".join(lines) + "\n"

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                body = snapshot().encode()
                self.send_response(200)
            except Exception:
                body = b"metric_source_error 1\n"
                self.send_response(503)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            return

    http.server.ThreadingHTTPServer(("0.0.0.0", 9100), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
