[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trpc-agent-service"
version = "0.1.0"
description = "Multi-tenant node-oriented service built on tRPC-Agent-Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.10.1,<2.0",
    "pydantic>=2.10,<3",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "trpc-agent-py",
    "uvicorn>=0.30",
    "wecom-aibot-python-sdk>=1.0.2,<2",
    "lark-channel-sdk>=1.4.0,<2",
    "minio>=7.2,<8",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "yapf>=0.40",
]

[project.scripts]
trpc-agent-service = "trpc_service._cli:entrypoint"

[tool.setuptools.packages.find]
include = ["trpc_service*"]

[tool.setuptools.package-data]
"trpc_service.web" = ["static/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error:There is no current event loop:DeprecationWarning",
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
