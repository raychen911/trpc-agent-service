[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trpc-agent-service"
version = "0.1.0"
description = "Crash-safe multi-tenant tRPC-Agent reference platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "tRPC-Agent platform maintainers"}]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.12.5",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "redis==6.4.0",
  "httpx==0.28.1",
  "websockets==14.2",
  "cryptography==44.0.0",
  "boto3==1.35.93",
  "opentelemetry-api==1.29.0",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
  "opentelemetry-exporter-otlp-proto-http==1.29.0",
  "opentelemetry-instrumentation-fastapi==0.50b0",
  "opentelemetry-instrumentation-httpx==0.50b0",
  "opentelemetry-instrumentation-sqlalchemy==0.50b0",
  "trpc-agent-py==1.1.14",
  # Transitive tRPC-Agent packages are constrained here to keep its broad
  # version ranges compatible with FastAPI/OTEL pins and avoid resolver
  # backtracking during production container builds.
  "mcp==1.29.1",
  "google-genai==2.22.0",
  "sse-starlette==2.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
]

[project.scripts]
trpc-agent-service = "trpc_service._cli:main"

[tool.setuptools.packages.find]
include = ["trpc_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "integration: requires an explicitly configured PostgreSQL and Redis test stack",
  "live: sends a probe through explicitly enabled sandbox channel credentials",
  "load: exercises an explicitly configured deployed HTTP endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # FastAPI dependency defaults and documented URL/query literals.

[tool.coverage.run]
branch = true
source = ["trpc_service"]

[tool.coverage.report]
show_missing = true
