[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trpc-agent-service"
version = "0.1.0"
description = "Small-scale, production-shaped multi-tenant service for tRPC-Agent-Python"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "cryptography>=43,<51",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1,<2",
  "redis>=5,<9",
  "sqlalchemy[asyncio]>=2.0,<3",
  "trpc-agent-py>=1.1.20,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "wecom-aibot-sdk-python>=0.1.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
trpc-service = "trpc_service._cli:app"

[tool.setuptools.packages.find]
include = ["trpc_service*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires real external credentials or services",
]

[tool.coverage.run]
branch = true
source = ["trpc_service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
