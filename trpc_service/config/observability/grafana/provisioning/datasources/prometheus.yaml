apiVersion: 1

datasources:
  - name: Prometheus
    uid: trpc-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: trpc-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: trpc-prometheus
  - name: Loki
    uid: trpc-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-fA-F0-9]{32})"'
          datasourceUid: trpc-tempo
          url: '$${__value.raw}'
