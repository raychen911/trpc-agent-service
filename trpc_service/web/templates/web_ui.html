<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teneuris Web UI IM（自测）</title>
<link rel="stylesheet" href="https://unpkg.com/tdesign-vue-next@1/dist/tdesign.min.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/tdesign-vue-next@1/dist/tdesign.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: linear-gradient(160deg, #eef3fb 0%, #e8edf7 60%, #eef2fa 100%); min-height: 100vh; }
  .hero { background: linear-gradient(120deg, #0b2a6b 0%, #1f5bd8 55%, #4b9bff 100%);
          color: #fff; padding: 26px 24px 58px; }
  .hero-inner { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .hero h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  .hero p { margin: 6px 0 0; opacity: .85; font-size: 13px; }
  .wrap { max-width: min(960px, calc(100vw - 48px)); margin: -34px auto 32px; padding: 0; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 6px 24px rgba(15,40,105,.10); overflow: hidden; }
  .meta { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-bottom: 1px solid #eef1f6; }
  .meta .lbl { font-size: 12px; color: #8a94a6; margin-right: 4px; }
  #chat { height: 440px; overflow-y: auto; padding: 18px 18px 6px;
          background: linear-gradient(180deg, #fbfcfe 0%, #f6f8fc 100%); }
  .line { display: flex; gap: 10px; margin: 12px 0; align-items: flex-end; }
  .line.me { flex-direction: row-reverse; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none;
            display: flex; align-items: center; justify-content: center; font-size: 17px;
            box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .avatar.bot { background: linear-gradient(135deg, #1f5bd8, #4b9bff); }
  .avatar.me { background: linear-gradient(135deg, #ff9a4d, #ff6f91); }
  .bubble { max-width: 76%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
            font-size: 14px; line-height: 1.55; word-break: break-word;
            box-shadow: 0 1px 3px rgba(15,40,105,.08); }
  .bubble.bot { background: #fff; border: 1px solid #e8ecf3; border-bottom-left-radius: 3px; }
  .bubble.me { background: linear-gradient(135deg, #1f5bd8, #3f83ff); color: #fff;
               border-bottom-right-radius: 3px; }
  .bubble.err { background: #fdecec; color: #c62828; border: 1px solid #f5c6c6; }
  .row { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid #eef1f6; align-items: center; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: #9db4dd;
              animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div class="hero"><div class="hero-inner">
  <h1>✨ Teneuris Web UI IM</h1>
  <p>多租户 Agent 平台 · 本地自测通道（不计入正式 IM）</p>
</div></div>
<div id="app" class="wrap">
  <div class="card">
    <div class="meta">
      <span class="lbl">租户</span>
      <t-input v-model="tenant" style="width:150px" size="small"></t-input>
      <span class="lbl">用户</span>
      <t-input v-model="user" style="width:180px" size="small"></t-input>
      <span style="flex:1"></span>
      <t-tag theme="primary" variant="light-outline" size="small">自测通道</t-tag>
    </div>
    <div id="chat">
      <div v-if="messages.length === 0" style="text-align:center;color:#9aa7bd;margin-top:150px;font-size:13px">
        发送第一条消息，开始与 Agent 对话
      </div>
      <div v-for="(m, i) in messages" :key="i" class="line" :class="{ me: m.cls === 'user' }">
        <div class="avatar" :class="m.cls === 'user' ? 'me' : 'bot'">{{ m.cls === 'user' ? '🧑' : '🤖' }}</div>
        <div class="bubble" :class="m.cls">
          <span v-if="m.typing" class="typing"><i></i><i></i><i></i></span>
          <template v-else>{{ m.text }}</template>
        </div>
      </div>
    </div>
    <div class="row">
      <t-input v-model="input" placeholder="输入消息，回车发送" @enter="send" clearable size="large"></t-input>
      <t-button theme="primary" size="large" :loading="sending" @click="send">发送</t-button>
    </div>
  </div>
</div>

<script>
const { createApp, ref, nextTick } = Vue;

const app = createApp({
  setup() {
    const tenant = ref('demo');
    const user = ref('web_user');
    const input = ref('');
    const sending = ref(false);
    const messages = ref([]);

    function add(text, cls, typing = false) {
      messages.value.push({ text, cls, typing });
      nextTick(() => {
        const box = document.getElementById('chat');
        if (box) box.scrollTop = box.scrollHeight;
      });
    }
    function stopTyping() {
      const last = messages.value[messages.value.length - 1];
      if (last && last.typing) messages.value.pop();
    }

    async function send() {
      const text = input.value.trim();
      if (!text || sending.value) return;
      add(text, 'user');
      add('', 'bot', true);  // 思考中占位
      input.value = '';
      sending.value = true;
      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenant_id: tenant.value.trim() || 'demo',
                                 user_id: user.value.trim() || 'web_user',
                                 content: text }),
        });
        const data = await resp.json();
        stopTyping();
        if (data.response_type === 'error') add(data.content, 'err');
        else add(data.content, 'bot');
      } catch (e) {
        stopTyping();
        add('请求失败: ' + e, 'err');
      } finally {
        sending.value = false;
      }
    }

    return { tenant, user, input, sending, messages, send };
  },
});
app.use(TDesign);
app.mount('#app');
</script>
</body>
</html>
