<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f6">
  <title>犀牛鸟 AI 助手</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --page: #f7f8f6;
      --surface: #ffffff;
      --surface-soft: #f0f2ef;
      --surface-hover: #e8eeea;
      --line: #dde2dd;
      --line-strong: #c9d1ca;
      --text: #202521;
      --text-soft: #4f5b54;
      --muted: #768179;
      --brand: #16866d;
      --brand-hover: #0f6f5a;
      --brand-soft: #e1f1eb;
      --user: #e8f4ef;
      --danger: #b85048;
      --warn: #a76a22;
      --shadow: 0 18px 45px rgba(27, 39, 33, .10);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #171a18;
      --surface: #202521;
      --surface-soft: #292f2b;
      --surface-hover: #323a35;
      --line: #343d37;
      --line-strong: #465049;
      --text: #eef2ef;
      --text-soft: #c3ccc6;
      --muted: #9ca7a0;
      --brand: #48bb9a;
      --brand-hover: #71d4b5;
      --brand-soft: #203f35;
      --user: #28473b;
      --danger: #ec8077;
      --warn: #d49c51;
      --shadow: 0 18px 45px rgba(0, 0, 0, .30);
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app {
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      background: var(--surface);
    }
    .sidebar {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 14px;
      padding: 16px 12px;
      border-right: 1px solid var(--line);
      background: var(--surface-soft);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; min-width: 0; }
    .brand-mark, .avatar-mark {
      display: grid;
      place-items: center;
      background: var(--brand);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0;
    }
    .brand-mark { width: 32px; height: 32px; border-radius: 8px; font-size: 11px; flex: 0 0 auto; }
    .brand-title { min-width: 0; }
    .brand-name { font-size: 15px; font-weight: 750; line-height: 1.2; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.2; }
    .new-chat {
      height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .new-chat:hover { border-color: var(--brand); background: var(--brand-soft); }
    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .history {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: grid;
      align-content: start;
      gap: 5px;
      padding-right: 2px;
    }
    .history::-webkit-scrollbar, .messages::-webkit-scrollbar { width: 10px; }
    .history::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 10px;
      background: color-mix(in srgb, var(--muted) 34%, transparent);
      background-clip: content-box;
    }
    .history-item {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 8px 8px 10px;
      border-radius: 7px;
      color: var(--text-soft);
      cursor: pointer;
    }
    .history-item:hover, .history-item.active { background: var(--surface); color: var(--text); }
    .history-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .history-meta { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .delete-chat {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
    }
    .history-item:hover .delete-chat, .history-item:focus-within .delete-chat { opacity: 1; }
    .delete-chat:hover { background: var(--surface-hover); color: var(--danger); }
    .sidebar-actions {
      display: grid;
      gap: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .side-action {
      min-height: 36px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 8px;
      font-size: 13px;
      text-align: left;
    }
    .side-action:hover { background: var(--surface); color: var(--text); }
    .workspace { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--surface); }
    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, var(--page));
    }
    .topbar-left, .topbar-right { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .mobile-menu { display: none; }
    .title-block { min-width: 0; }
    .model-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 750; line-height: 1.25; }
    .session-line { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      max-width: 260px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-soft);
      background: var(--surface-soft);
      font-size: 12px;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
    .status-pill.ready .status-dot { background: var(--brand); }
    .status-pill.running .status-dot { background: var(--warn); animation: blink 1s infinite ease-in-out; }
    .status-pill.error .status-dot { background: var(--danger); }
    @keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .icon-button {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 16px;
    }
    .icon-button:hover { background: var(--surface-hover); color: var(--text); }
    .conversation {
      min-height: 0;
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      background: var(--surface);
    }
    .messages {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      padding: 30px 24px 34px;
    }
    .message-list {
      width: min(880px, 100%);
      min-height: 100%;
      margin: 0 auto;
      display: grid;
      align-content: start;
      gap: 28px;
    }
    .welcome {
      min-height: min(460px, 62vh);
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 12px;
      text-align: center;
    }
    .welcome .avatar-mark { width: 54px; height: 54px; border-radius: 14px; font-size: 14px; box-shadow: 0 10px 24px rgba(22, 134, 109, .18); }
    .welcome h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
    .welcome p { margin: 0; max-width: 500px; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .suggestions {
      width: min(620px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 10px;
    }
    .suggestion {
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-soft);
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      line-height: 1.45;
    }
    .suggestion:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--text); }
    .message {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }
    .message.user { grid-template-columns: minmax(0, 1fr) 34px; }
    .message-avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--brand-soft);
      color: var(--brand-hover);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }
    .message.user .message-avatar { grid-column: 2; background: var(--brand); color: #fff; }
    .message-body { min-width: 0; padding-top: 1px; }
    .message.user .message-body { grid-column: 1; grid-row: 1; justify-self: end; max-width: min(720px, 84%); }
    .message-head { display: flex; align-items: center; gap: 8px; min-height: 18px; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
    .message-time { color: color-mix(in srgb, var(--muted) 72%, transparent); }
    .message-text {
      max-width: 100%;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.78;
    }
    .message.agent .message-text { white-space: normal; }
    .message-text p { margin: 0 0 12px; }
    .message-text p:last-child { margin-bottom: 0; }
    .message-text strong { font-weight: 750; }
    .message-text ul {
      margin: 4px 0 14px;
      padding-left: 20px;
    }
    .message-text li { margin: 4px 0; }
    .message-text code {
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-soft);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: .92em;
    }
    .message-text pre {
      max-width: 100%;
      margin: 10px 0 14px;
      padding: 12px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      line-height: 1.55;
      white-space: pre;
    }
    .message-text pre code {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      font-size: 13px;
    }
    .message-text .md-heading {
      margin: 16px 0 8px;
      font-weight: 800;
      line-height: 1.45;
    }
    .message-text .md-heading:first-child { margin-top: 0; }
    .message.user .message-text {
      padding: 10px 13px;
      border: 1px solid color-mix(in srgb, var(--brand) 18%, transparent);
      border-radius: 11px 3px 11px 11px;
      background: var(--user);
      line-height: 1.65;
    }
    .message-tools { display: flex; align-items: center; gap: 5px; min-height: 25px; margin-top: 8px; opacity: 0; transition: opacity .16s; }
    .message:hover .message-tools, .message:focus-within .message-tools { opacity: 1; }
    .tool-button {
      min-height: 24px;
      padding: 0 7px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }
    .tool-button:hover { background: var(--surface-hover); color: var(--text); }
    .typing { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding-top: 3px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 1.1s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .12s; }
    .typing i:nth-child(3) { animation-delay: .24s; }
    @keyframes pulse { 0%, 65%, 100% { opacity: .25; transform: translateY(0); } 32% { opacity: 1; transform: translateY(-3px); } }
    .scroll-bottom {
      position: absolute;
      right: 26px;
      bottom: 18px;
      display: none;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-soft);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 12px;
    }
    .scroll-bottom.show { display: inline-flex; }
    .composer-area {
      padding: 11px 24px 18px;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 96%, var(--page));
    }
    .composer { width: min(880px, 100%); margin: 0 auto; }
    .composer-box {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .composer-box:focus-within { border-color: var(--brand); box-shadow: 0 14px 34px rgba(22, 134, 109, .14); }
    textarea {
      width: 100%;
      min-height: 30px;
      max-height: 180px;
      padding: 3px 2px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
    }
    textarea::placeholder { color: var(--muted); }
    .composer-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .small-action {
      height: 32px;
      min-width: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 12px;
    }
    .small-action:hover { background: var(--surface-hover); color: var(--text); }
    .attachment-chip {
      display: none;
      align-items: center;
      gap: 7px;
      max-width: min(360px, 54vw);
      min-height: 28px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text-soft);
      background: var(--surface-soft);
      font-size: 12px;
    }
    .attachment-chip.show { display: inline-flex; }
    .attachment-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-attachment { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
    .send {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }
    .send:hover { background: var(--brand-hover); }
    .send:disabled { background: var(--line-strong); cursor: default; }
    .stop { display: none; border: 1px solid var(--line-strong); background: var(--surface); }
    .stop.show { display: inline-flex; }
    .disclaimer { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; text-align: center; }
    .settings {
      position: fixed;
      right: 18px;
      bottom: 78px;
      z-index: 20;
      display: none;
      width: min(360px, calc(100vw - 36px));
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .settings.open { display: grid; gap: 12px; }
    .settings-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .settings h2 { margin: 0; font-size: 14px; }
    .settings-grid { display: grid; gap: 9px; }
    .field { display: grid; gap: 5px; }
    .field label { color: var(--muted); font-size: 11px; }
    .field input {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: 0;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
    }
    .field input:focus { border-color: var(--brand); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      z-index: 30;
      display: none;
      max-width: min(520px, calc(100vw - 32px));
      transform: translateX(-50%);
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-soft);
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    .toast.show { display: block; }
    .overlay { display: none; }
    @media (max-width: 820px) {
      body { overflow: hidden; }
      .app { display: block; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 25;
        width: min(300px, 84vw);
        transform: translateX(-100%);
        transition: transform .2s ease;
        box-shadow: var(--shadow);
      }
      .sidebar.open { transform: translateX(0); }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 24;
        background: rgba(0, 0, 0, .28);
      }
      .overlay.open { display: block; }
      .workspace { height: 100dvh; }
      .topbar { min-height: 54px; padding: 0 12px; }
      .mobile-menu { display: inline-grid; }
      .status-pill { max-width: 132px; padding: 0 8px; }
      .session-line { max-width: 210px; }
      .messages { padding: 20px 14px 28px; }
      .message-list { gap: 24px; }
      .welcome { min-height: min(420px, 58vh); }
      .welcome h1 { font-size: 22px; }
      .welcome p { font-size: 13px; }
      .suggestions { grid-template-columns: 1fr; }
      .message { grid-template-columns: 29px minmax(0, 1fr); gap: 9px; }
      .message.user { grid-template-columns: minmax(0, 1fr) 29px; }
      .message-avatar { width: 29px; height: 29px; border-radius: 8px; }
      .message.user .message-body { max-width: 91%; }
      .message-text { font-size: 14px; line-height: 1.72; }
      .message-tools { opacity: 1; }
      .composer-area { padding: 9px 11px 12px; }
      .disclaimer { font-size: 10px; }
      .settings { right: 12px; bottom: 70px; }
      .scroll-bottom { right: 14px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div class="brand-title">
          <div class="brand-name">犀牛鸟 AI</div>
          <div class="brand-sub">Web IM 调试台</div>
        </div>
      </div>
      <button class="new-chat" id="newChat" type="button"><span>＋</span>新建会话</button>
      <div class="history-head"><span>最近对话</span><button class="tool-button" id="clearHistory" type="button">清空</button></div>
      <div class="history" id="history"></div>
      <div class="sidebar-actions">
        <button class="side-action" id="settingsButton" type="button"><span>⚙</span>会话设置</button>
        <button class="side-action" id="themeButton" type="button"><span id="themeIcon">◐</span><span id="themeText">深色模式</span></button>
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="menuButton" type="button" title="打开菜单">☰</button>
          <div class="title-block">
            <div class="model-name">犀牛鸟智能助手</div>
            <div class="session-line" id="sessionLine">新会话</div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="status-pill ready" id="statusPill"><span class="status-dot"></span><span id="statusText">准备就绪</span></div>
          <button class="icon-button" id="clearButton" type="button" title="清空当前对话">⌫</button>
        </div>
      </header>

      <section class="conversation">
        <div class="messages" id="messages">
          <div class="message-list" id="messageList"></div>
        </div>
        <button class="scroll-bottom" id="scrollBottom" type="button">↓ 回到底部</button>
      </section>

      <div class="composer-area">
        <form class="composer" id="form">
          <div class="composer-box">
            <textarea name="text" rows="1" placeholder="输入消息，按 Enter 发送，Shift + Enter 换行" autocomplete="off"></textarea>
            <div class="composer-tools">
              <div class="composer-left">
                <label class="small-action" for="fileInput" title="添加文件">＋ 文件</label>
                <input id="fileInput" type="file" hidden>
                <span class="attachment-chip" id="attachmentChip"><span class="attachment-name" id="attachmentName"></span><button class="remove-attachment" id="removeAttachment" type="button">×</button></span>
              </div>
              <div class="composer-right">
                <button class="small-action stop" id="stopButton" type="button">停止</button>
                <button class="send" id="sendButton" type="submit" title="发送">↑</button>
              </div>
            </div>
          </div>
          <p class="disclaimer">AI 生成内容仅供参考，请核验重要信息</p>
        </form>
      </div>
    </main>
  </div>

  <section class="settings" id="settings">
    <div class="settings-head">
      <h2>会话设置</h2>
      <button class="icon-button" id="closeSettings" type="button" title="关闭">×</button>
    </div>
    <div class="settings-grid">
      <div class="field"><label for="channel">channel</label><input id="channel" name="channel" value="web"></div>
      <div class="field"><label for="accountId">account_id</label><input id="accountId" name="account_id" value="web_demo"></div>
      <div class="field"><label for="userId">user_id</label><input id="userId" name="user_id" value="ui-user"></div>
      <div class="field"><label for="groupId">group_id（可选）</label><input id="groupId" name="group_id" placeholder="留空时使用当前 Web 会话 ID"></div>
    </div>
  </section>
  <div class="toast" id="toast"></div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const storageKey = 'trpc-agent-web-ui-history-v3';
    const themeKey = 'trpc-agent-web-ui-theme';
    const form = $('#form');
    const text = form.querySelector('textarea');
    const messages = $('#messages');
    const list = $('#messageList');
    const sendButton = $('#sendButton');
    const stopButton = $('#stopButton');
    const statusPill = $('#statusPill');
    const statusText = $('#statusText');
    const sessionLine = $('#sessionLine');
    const scrollBottomButton = $('#scrollBottom');
    const attachmentChip = $('#attachmentChip');
    const attachmentName = $('#attachmentName');
    const fileInput = $('#fileInput');
    let chats = readChats();
    let current = createChat();
    let attachment = null;
    let abortController = null;

    function newId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'ui-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function createChat() {
      return { id: newId(), title: '新会话', messages: [], serverSessionId: '', modelMode: '', updatedAt: Date.now() };
    }
    function readChats() {
      try {
        const value = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }
    function persistChats() {
      localStorage.setItem(storageKey, JSON.stringify(chats.slice(-30)));
    }
    function formatTime(ts) {
      if (!ts) return '';
      return new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit' }).format(new Date(ts));
    }
    function modelModeLabel(mode) {
      if (mode === 'responses') return '真实模型';
      if (mode === 'codex_cli') return 'Codex CLI';
      if (mode === 'fallback') return '本地演示';
      return '未连接';
    }
    function setStatus(textValue, state = 'ready') {
      statusText.textContent = textValue;
      statusPill.className = 'status-pill ' + state;
    }
    function updateHeader() {
      sessionLine.textContent = current.title && current.title !== '新会话'
        ? current.title
        : '当前对话';
    }
    function showToast(value) {
      const toast = $('#toast');
      toast.textContent = value;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    function isNearBottom() {
      return messages.scrollHeight - messages.scrollTop - messages.clientHeight < 96;
    }
    function scrollToBottom(force = false) {
      if (force || isNearBottom()) messages.scrollTop = messages.scrollHeight;
      updateScrollButton();
    }
    function updateScrollButton() {
      scrollBottomButton.classList.toggle('show', !isNearBottom() && current.messages.length > 0);
    }
    function renderWelcome() {
      list.innerHTML = [
        '<div class="welcome" id="welcome">',
        '<div class="avatar-mark">AI</div>',
        '<h1>你好，我是犀牛鸟 AI</h1>',
        '<p>可以帮你整理信息、生成内容、分析问题，也能协助处理技术任务。</p>',
        '<div class="suggestions">',
        '<button class="suggestion" type="button">帮我梳理一个项目方案</button>',
        '<button class="suggestion" type="button">解释一个技术概念</button>',
        '<button class="suggestion" type="button">优化一段文字表达</button>',
        '<button class="suggestion" type="button">帮我分析这段代码</button>',
        '</div>',
        '</div>',
      ].join('');
    }
    function renderHistory() {
      const history = $('#history');
      history.innerHTML = '';
      const items = chats.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'history-item';
        empty.innerHTML = '<div><div class="history-title">还没有历史对话</div><div class="history-meta">发送消息后会保存</div></div>';
        history.appendChild(empty);
        return;
      }
      for (const chat of items) {
        const item = document.createElement('div');
        item.className = 'history-item' + (chat.id === current.id ? ' active' : '');
        const body = document.createElement('div');
        body.innerHTML = '<div class="history-title"></div><div class="history-meta"></div>';
        body.querySelector('.history-title').textContent = chat.title || '新会话';
        body.querySelector('.history-meta').textContent = `${modelModeLabel(chat.modelMode)} · ${formatTime(chat.updatedAt)}`;
        body.onclick = () => loadChat(chat.id);
        const del = document.createElement('button');
        del.className = 'delete-chat';
        del.type = 'button';
        del.title = '删除会话';
        del.textContent = '×';
        del.onclick = (event) => {
          event.stopPropagation();
          chats = chats.filter((item) => item.id !== chat.id);
          if (current.id === chat.id) resetChat(false);
          persistChats();
          renderHistory();
        };
        item.append(body, del);
        history.appendChild(item);
      }
    }
    function saveCurrent() {
      current.updatedAt = Date.now();
      chats = chats.filter((chat) => chat.id !== current.id);
      if (current.messages.length) {
        const snapshot = typeof structuredClone === 'function'
          ? structuredClone(current)
          : JSON.parse(JSON.stringify(current));
        chats.push(snapshot);
      }
      persistChats();
      renderHistory();
      updateHeader();
    }
    function messageElement(item) {
      const article = document.createElement('article');
      article.className = 'message ' + item.kind;
      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = item.kind === 'user' ? 'U' : 'AI';
      const body = document.createElement('div');
      body.className = 'message-body';
      const head = document.createElement('div');
      head.className = 'message-head';
      const name = document.createElement('span');
      name.textContent = item.kind === 'user' ? '你' : '犀牛鸟 AI';
      const time = document.createElement('span');
      time.className = 'message-time';
      time.textContent = formatTime(item.createdAt);
      const textNode = document.createElement('div');
      textNode.className = 'message-text';
      if (item.kind === 'agent') {
        textNode.innerHTML = renderMarkdown(item.value);
      } else {
        textNode.textContent = item.value;
      }
      head.append(name, time);
      body.append(head, textNode);
      if (item.kind === 'agent') {
        const tools = document.createElement('div');
        tools.className = 'message-tools';
        const copy = document.createElement('button');
        copy.className = 'tool-button';
        copy.type = 'button';
        copy.textContent = '复制';
        copy.onclick = () => copyText(item.value, copy);
        tools.appendChild(copy);
        body.appendChild(tools);
      }
      article.append(item.kind === 'user' ? body : avatar, item.kind === 'user' ? avatar : body);
      return article;
    }
    function renderMessages() {
      if (!current.messages.length) {
        renderWelcome();
      } else {
        list.innerHTML = '';
        current.messages.forEach((item) => list.appendChild(messageElement(item)));
      }
      updateHeader();
      scrollToBottom(true);
    }
    function addMessage(kind, value, save = true) {
      $('#welcome')?.remove();
      const item = { kind, value, createdAt: Date.now() };
      list.appendChild(messageElement(item));
      if (save) {
        current.messages.push(item);
        if (kind === 'user' && current.title === '新会话') current.title = value.slice(0, 28);
        saveCurrent();
      }
      scrollToBottom(true);
    }
    function loadChat(id) {
      const chat = chats.find((item) => item.id === id);
      if (!chat) return;
      current = JSON.parse(JSON.stringify(chat));
      renderMessages();
      renderHistory();
      closeMenu();
      text.focus();
    }
    function resetChat(close = true) {
      current = createChat();
      attachment = null;
      clearAttachment();
      setStatus('准备就绪', 'ready');
      renderMessages();
      renderHistory();
      if (close) closeMenu();
      text.focus();
    }
    function settingsPayload() {
      return {
        channel: $('#channel').value.trim() || 'web',
        account_id: $('#accountId').value.trim() || 'web_demo',
        user_id: $('#userId').value.trim() || 'ui-user',
        group_id: $('#groupId').value.trim() || current.id,
      };
    }
    function resizeInput() {
      text.style.height = 'auto';
      text.style.height = Math.min(text.scrollHeight, 180) + 'px';
    }
    function setRunning(running) {
      sendButton.disabled = running;
      stopButton.classList.toggle('show', running);
      text.disabled = running;
    }
    function addTyping() {
      const typing = document.createElement('article');
      typing.className = 'message';
      typing.innerHTML = '<div class="message-avatar">AI</div><div class="message-body"><div class="message-head"><span>犀牛鸟 AI</span><span class="message-time">正在回复</span></div><div class="typing"><i></i><i></i><i></i></div></div>';
      list.appendChild(typing);
      scrollToBottom(true);
      return typing;
    }
    function copyText(value, control) {
      const done = () => {
        const old = control.textContent;
        control.textContent = '已复制';
        setTimeout(() => control.textContent = old, 1200);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(value).then(done).catch(() => showToast('复制失败'));
      } else {
        showToast('当前浏览器不支持直接复制');
      }
    }
    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }
    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }
    function renderTextMarkdown(segment) {
      const lines = segment.replace(/\r\n/g, '\n').split('\n');
      const html = [];
      let paragraph = [];
      let list = [];
      const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push('<p>' + paragraph.join('<br>') + '</p>');
        paragraph = [];
      };
      const flushList = () => {
        if (!list.length) return;
        html.push('<ul>' + list.map((item) => '<li>' + item + '</li>').join('') + '</ul>');
        list = [];
      };
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) {
          flushParagraph();
          flushList();
          continue;
        }
        const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          html.push('<div class="md-heading">' + inlineMarkdown(heading[2]) + '</div>');
          continue;
        }
        const bullet = trimmed.match(/^[-*]\s+(.+)$/);
        if (bullet) {
          flushParagraph();
          list.push(inlineMarkdown(bullet[1]));
          continue;
        }
        flushList();
        paragraph.push(inlineMarkdown(line));
      }
      flushParagraph();
      flushList();
      return html.join('');
    }
    function renderMarkdown(value) {
      const source = String(value || '');
      const html = [];
      const fence = /```([A-Za-z0-9_-]+)?\n?([\s\S]*?)```/g;
      let cursor = 0;
      let match;
      while ((match = fence.exec(source)) !== null) {
        html.push(renderTextMarkdown(source.slice(cursor, match.index)));
        html.push('<pre><code>' + escapeHtml(match[2].replace(/\n$/, '')) + '</code></pre>');
        cursor = match.index + match[0].length;
      }
      html.push(renderTextMarkdown(source.slice(cursor)));
      return html.join('').trim() || '<p></p>';
    }
    function clearAttachment() {
      attachment = null;
      fileInput.value = '';
      attachmentName.textContent = '';
      attachmentChip.classList.remove('show');
    }
    function closeMenu() {
      $('#sidebar').classList.remove('open');
      $('#overlay').classList.remove('open');
    }
    async function submitMessage() {
      const value = text.value.trim();
      if (!value || sendButton.disabled) return;
      const payload = { ...settingsPayload(), text: value, attachments: attachment ? [attachment] : [] };
      addMessage('user', value);
      text.value = '';
      resizeInput();
      clearAttachment();
      setRunning(true);
      setStatus('正在思考', 'running');
      const typing = addTyping();
      abortController = new AbortController();
      try {
        const response = await fetch('/ui/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: abortController.signal,
        });
        const result = await response.json();
        typing.remove();
        if (!response.ok) throw new Error(result.detail || result.error || '请求失败');
        current.serverSessionId = result.session_id || current.serverSessionId;
        current.modelMode = result.model_mode || current.modelMode;
        addMessage('agent', result.answer || '服务返回为空');
        setStatus(result.model_mode === 'fallback' ? '本地演示模式' : result.model_mode === 'codex_cli' ? 'Codex CLI' : '真实模型已连接', 'ready');
      } catch (error) {
        typing.remove();
        const aborted = error.name === 'AbortError';
        addMessage('agent', aborted ? '已停止本次回复。' : '请求未完成：' + error.message);
        setStatus(aborted ? '已停止' : '请求失败', aborted ? 'ready' : 'error');
      } finally {
        abortController = null;
        setRunning(false);
        text.disabled = false;
        text.focus();
        updateHeader();
      }
    }
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      submitMessage();
    });
    text.addEventListener('input', resizeInput);
    text.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        submitMessage();
      }
    });
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        showToast('文件不能超过 10MB');
        clearAttachment();
        return;
      }
      attachmentName.textContent = file.name;
      attachmentChip.classList.add('show');
      const reader = new FileReader();
      reader.onload = () => {
        attachment = {
          kind: 'file',
          name: file.name,
          content_type: file.type || 'application/octet-stream',
          metadata: { content_base64: String(reader.result).split(',')[1] || '' },
        };
      };
      reader.readAsDataURL(file);
    });
    $('#removeAttachment').onclick = clearAttachment;
    $('#newChat').onclick = () => resetChat(true);
    $('#clearButton').onclick = () => resetChat(false);
    $('#clearHistory').onclick = () => {
      chats = [];
      persistChats();
      resetChat(false);
      showToast('历史对话已清空');
    };
    $('#menuButton').onclick = () => {
      $('#sidebar').classList.add('open');
      $('#overlay').classList.add('open');
    };
    $('#overlay').onclick = closeMenu;
    $('#settingsButton').onclick = () => $('#settings').classList.toggle('open');
    $('#closeSettings').onclick = () => $('#settings').classList.remove('open');
    $('#stopButton').onclick = () => abortController?.abort();
    scrollBottomButton.onclick = () => scrollToBottom(true);
    messages.addEventListener('scroll', updateScrollButton, { passive: true });
    document.addEventListener('wheel', (event) => {
      const target = event.target;
      if (target.closest('textarea, .history, .settings, .sidebar')) return;
      messages.scrollTop += event.deltaY;
      updateScrollButton();
    }, { passive: true });
    document.addEventListener('click', (event) => {
      const suggestion = event.target.closest('.suggestion');
      if (suggestion) {
        text.value = suggestion.textContent;
        resizeInput();
        text.focus();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeMenu();
        $('#settings').classList.remove('open');
      }
    });
    $('#themeButton').onclick = () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      const next = dark ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem(themeKey, next);
      $('#themeText').textContent = dark ? '深色模式' : '浅色模式';
      $('#themeIcon').textContent = dark ? '◐' : '☀';
    };
    for (const input of ['#userId', '#groupId', '#channel', '#accountId'].map($)) {
      input.addEventListener('input', updateHeader);
    }
    if (localStorage.getItem(themeKey) === 'dark') $('#themeButton').click();
    renderMessages();
    renderHistory();
    resizeInput();
    text.focus();
  </script>
</body>
</html>
