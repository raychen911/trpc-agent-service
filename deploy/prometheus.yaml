global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: trpc-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
