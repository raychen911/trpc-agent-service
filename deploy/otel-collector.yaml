receivers:
  otlp:
    protocols:
      # The collector runs in its own container/Pod. Binding to the default
      # loopback listener would make it healthy while rejecting every other
      # platform workload's OTLP export.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
