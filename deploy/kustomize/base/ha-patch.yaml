# Keep replicas on separate nodes when the cluster has capacity.  These are
# preferred anti-affinity rules so a single-node development cluster remains
# renderable/schedulable; production still requires a topology-spread check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-gateway
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trpc-gateway
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: trpc-gateway
---
