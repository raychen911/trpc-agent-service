apiVersion: v1
kind: Secret
metadata: {name: trpc-agent-runtime-secrets}
type: Opaque
stringData:
  TRPC_SERVICE_DATABASE_URL: postgresql://trpc_runtime:password@postgres:5432/trpc
  TRPC_SERVICE_REDIS_URL: redis://redis:6379/0
  TRPC_SERVICE_SESSION_HMAC_KEY: replace-with-at-least-32-random-characters
  TRPC_AGENT_MODEL_NAME: replace-with-model-name
  TRPC_AGENT_API_KEY: replace-with-model-api-key
  TRPC_AGENT_EMBEDDING_MODEL: replace-with-embedding-model
---
apiVersion: v1
kind: Secret
metadata: {name: trpc-agent-control-secrets}
type: Opaque
stringData:
  TRPC_SERVICE_CONTROL_DATABASE_URL: postgresql://trpc_control:password@postgres:5432/trpc
---
apiVersion: v1
kind: Secret
metadata: {name: trpc-agent-admin-secrets}
type: Opaque
stringData:
  TRPC_SERVICE_ADMIN_TOKEN_REF: env://TRPC_ADMIN_TOKEN
  TRPC_SERVICE_ADMIN_OPERATOR_TOKEN_REF: env://TRPC_OPERATOR_TOKEN
  TRPC_SERVICE_ADMIN_VIEWER_TOKEN_REF: env://TRPC_VIEWER_TOKEN
  TRPC_ADMIN_TOKEN: replace-me
  TRPC_OPERATOR_TOKEN: replace-me-with-another-value
  TRPC_VIEWER_TOKEN: replace-me-with-another-value
---
apiVersion: v1
kind: Secret
metadata: {name: trpc-agent-migration-secrets}
type: Opaque
stringData:
  TRPC_SERVICE_MIGRATION_DATABASE_URL: postgresql://trpc_owner:password@postgres:5432/trpc
