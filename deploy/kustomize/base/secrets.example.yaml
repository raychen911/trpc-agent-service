# ===================================================================
# secrets.example.yaml - 密钥模板（复制为 secrets.yaml 后填写真实值）
# ===================================================================
# 说明: 注入方式为环境变量（envFrom secretRef），应用经 loader 的
#   TENEURIS_* 覆盖机制与 {env: NAME} 引用消费（PRD 4.5: 配置只存引用）。
#   secrets.yaml 已列入 .gitignore（勿提交真实密钥）：
#     kubectl create secret generic teneuris-secrets \
#       --from-env-file=secrets.env   # 或 kubectl apply -f secrets.yaml
# ===================================================================
apiVersion: v1
kind: Secret
metadata:
  name: teneuris-secrets
type: Opaque
stringData:
  # Admin API 访问密钥（生产安全校验强制要求）
  TENEURIS_ADMIN_API_KEY: "replace-with-admin-key"
  # 托管 SQL DSN（生产禁止 sqlite；示例为 MySQL，可换 postgresql+asyncpg）
  TENEURIS_STORAGE_SQL_DSN: "mysql+aiomysql://user:password@mysql.internal:3306/teneuris"
  # 模型 API key（framework runner 启动预检必需，PRD 4.5 密钥不落库）
  DEEPSEEK_API_KEY: "sk-replace-with-model-key"
  # 集群内 Redis 时不需覆盖 DSN；托管 Redis 时取消注释：
  # TENEURIS_STORAGE_REDIS_DSN: "redis://:password@redis.internal:6379/0"
