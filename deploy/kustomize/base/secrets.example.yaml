# Do not add this file to kustomization. Create these Secrets through
# ExternalSecret/Vault/KMS or your deployment system.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-service-secrets
type: Opaque
stringData:
  TRPC_SERVICE_DATABASE_DSN: postgresql://trpc_runtime:REPLACE@postgres/trpc_service
  TRPC_SERVICE_REDIS_URL: redis://:REPLACE@redis:6379/0
  TRPC_SERVICE_SESSION_HMAC_KEY: REPLACE_WITH_32_OR_MORE_RANDOM_BYTES
  TRPC_SERVICE_EMERGENCY_QUEUE_KEY: REPLACE_WITH_EXACTLY_32_RANDOM_BYTES
  # Add a versioned previous key only during an explicit rotation window.
  # TRPC_SERVICE_EMERGENCY_QUEUE_PREVIOUS_KEY_V0: REPLACE_WITH_EXACTLY_32_RANDOM_BYTES
  TRPC_SERVICE_S3_ACCESS_KEY: REPLACE_WITH_MINIO_APPLICATION_USER
  TRPC_SERVICE_S3_SECRET_KEY: REPLACE_WITH_MINIO_APPLICATION_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-worker-secrets
type: Opaque
stringData:
  # This Secret is mounted only by worker/dispatcher/projector/recovery pods.
  # The worker account is provisioned out-of-band with the grants for the
  # SECURITY DEFINER cross-tenant functions.
  TRPC_SERVICE_WORKER_DATABASE_DSN_REF: env://TRPC_SERVICE_WORKER_DATABASE_DSN
  TRPC_SERVICE_WORKER_DATABASE_DSN: postgresql://trpc_worker:REPLACE@postgres/trpc_service
  TRPC_SERVICE_WORKER_DATABASE_PASSWORD_REF: env://TRPC_SERVICE_WORKER_DATABASE_PASSWORD
  TRPC_SERVICE_WORKER_DATABASE_PASSWORD: REPLACE_WITH_WORKER_ROLE_PASSWORD
---
# Mounted as one read-only file only by trpc-worker. Tenant model revisions
# reference file:///run/secrets/model_api_key; no other application role needs
# the provider credential.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-model-secrets
type: Opaque
stringData:
  model_api_key: REPLACE_WITH_MODEL_PROVIDER_API_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-migration-secrets
type: Opaque
stringData:
  TRPC_SERVICE_DATABASE_DSN: postgresql://trpc_migration:REPLACE@postgres/trpc_service
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-metrics-secrets
type: Opaque
stringData:
  # Required when the real HPA backlog metric is enabled.  This is the
  # dedicated NOBYPASSRLS metrics role, not the worker database account.
  TRPC_SERVICE_METRICS_DATABASE_DSN: postgresql://trpc_metrics:REPLACE@postgres/trpc_service
---
# Mounted only by the production Gateway, Worker, Channel Dispatcher, and
# WeCom Connector. Channel bindings store file:// references to these keys;
# they never store the values themselves.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-im-secrets
type: Opaque
stringData:
  feishu_app_secret: REPLACE_WITH_FEISHU_APP_SECRET
  feishu_verification_token: REPLACE_WITH_FEISHU_VERIFICATION_TOKEN
  feishu_encrypt_key: REPLACE_WITH_FEISHU_ENCRYPT_KEY
  wecom_bot_secret: REPLACE_WITH_WECOM_BOT_SECRET
---
# Required only while the production overlay uses its default in-cluster
# PostgreSQL, Redis, and MinIO resources. A managed-service overlay deletes
# those workloads and supplies the application DSNs through the Secrets above.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-infrastructure-secrets
type: Opaque
stringData:
  postgres_superuser_password: REPLACE_WITH_POSTGRES_SUPERUSER_PASSWORD
  runtime_database_password: REPLACE_WITH_RUNTIME_DATABASE_PASSWORD
  migration_database_password: REPLACE_WITH_MIGRATION_DATABASE_PASSWORD
  worker_database_password: REPLACE_WITH_WORKER_DATABASE_PASSWORD
  metrics_database_password: REPLACE_WITH_METRICS_DATABASE_PASSWORD
  redis_password: REPLACE_WITH_REDIS_PASSWORD
  minio_root_user: REPLACE_WITH_MINIO_ROOT_USER
  minio_root_password: REPLACE_WITH_MINIO_ROOT_PASSWORD
  minio_application_user: REPLACE_WITH_MINIO_APPLICATION_USER
  minio_application_password: REPLACE_WITH_MINIO_APPLICATION_PASSWORD
