# ===================================================================
# gateway.yaml - Agent Gateway Deployment + Service（无状态多副本）
# ===================================================================
# 说明: 无状态 Worker（PRD 1.3）——会话/记忆/幂等全在共享 Redis/SQL，
#   扩缩副本不粘 session；探针复用 /healthz（存活）与 /readyz（就绪，
#   真实探测 Redis/SQL 连通）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teneuris-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teneuris-gateway
  template:
    metadata:
      labels:
        app: teneuris-gateway
    spec:
      containers:
        - name: gateway
          image: trpc-agent-service:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: teneuris-secrets
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: teneuris-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: teneuris-gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http
