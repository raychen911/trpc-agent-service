apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-service-config
data:
  TRPC_SERVICE_ENVIRONMENT: production
  TRPC_SERVICE_LOG_LEVEL: INFO
  TRPC_SERVICE_PORT: "8080"
  TRPC_SERVICE_ALLOW_DEVELOPMENT_TOKEN: "false"
  TRPC_SERVICE_OIDC_ISSUER: https://identity.example.internal/
  TRPC_SERVICE_OIDC_AUDIENCE: trpc-agent-service
  TRPC_SERVICE_SCHEDULER_VERSION: v2
  TRPC_SERVICE_REDIS_STREAM: trpc:session-ready:v2
  TRPC_SERVICE_REDIS_CONSUMER_GROUP: trpc-session-ready-v2
  TRPC_SERVICE_DATABASE_DSN_REF: env://TRPC_SERVICE_DATABASE_DSN
  TRPC_SERVICE_REDIS_URL_REF: env://TRPC_SERVICE_REDIS_URL
  TRPC_SERVICE_SESSION_HMAC_REF: env://TRPC_SERVICE_SESSION_HMAC_KEY
  TRPC_SERVICE_EMERGENCY_QUEUE_KEY_REF: env://TRPC_SERVICE_EMERGENCY_QUEUE_KEY
  TRPC_SERVICE_EMERGENCY_QUEUE_KEY_VERSION: v1
  TRPC_SERVICE_EMERGENCY_QUEUE_PREVIOUS_KEY_REFS: "{}"
  TRPC_SERVICE_RUNTIME_STATE_DIR: /tmp/trpc-agent-service
  TRPC_SERVICE_TENANT_SECRET_ROOT: /run/secrets
  TRPC_SERVICE_TENANT_SECRET_ENV_NAMES: "[]"
  TRPC_SERVICE_MODEL_ENDPOINT_HOSTS: '["api.openai.com"]'
  TRPC_SERVICE_FEISHU_ALLOW_STALE_BINDING_CACHE: "false"
  # The official origin is the only value allowed unless an explicitly
  # enabled online-acceptance overlay routes Channel Dispatcher traffic
  # through the independent Feishu OpenAPI witness.
  TRPC_SERVICE_FEISHU_SEND_API_ROOT: https://open.feishu.cn
  TRPC_SERVICE_ONLINE_TESTS_ENABLED: "false"
  TRPC_SERVICE_S3_ENDPOINT: https://s3.example.internal
  TRPC_SERVICE_S3_BUCKET: trpc-artifacts
  TRPC_SERVICE_S3_SECRET_KEY_REF: env://TRPC_SERVICE_S3_SECRET_KEY
  TRPC_SERVICE_MEDIA_DOWNLOAD_MAX_BYTES: "20971520"
  TRPC_SERVICE_MEDIA_DOWNLOAD_TIMEOUT_SECONDS: "30"
  TRPC_SERVICE_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  TRPC_SERVICE_CAPTURE_CONTENT: "false"
  TRPC_SERVICE_RECOVERY_BATCH_SIZE: "25"
  TRPC_SERVICE_RECOVERY_POLL_SECONDS: "5"
  TRPC_SERVICE_ARTIFACT_GC_BATCH_SIZE: "100"
  TRPC_SERVICE_ARTIFACT_GC_POLL_SECONDS: "60"
  TRPC_SERVICE_ARTIFACT_STAGING_TTL_SECONDS: "86400"
  # The base production-shaped manifest must be capable of the 200-turn gate:
  # HPA maxReplicas (20) x this concurrency (10) = 200.
  TRPC_SERVICE_WORKER_CONCURRENCY: "10"
