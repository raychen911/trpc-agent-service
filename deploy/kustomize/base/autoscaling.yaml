apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: trpc-agent-gateway}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: trpc-agent-gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: trpc-agent-worker}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: trpc-agent-worker}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
