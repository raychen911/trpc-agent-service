apiVersion: apps/v1
kind: Deployment
metadata: {name: trpc-agent-admin}
spec:
  replicas: 1
  selector: {matchLabels: {app: trpc-agent-service, role: admin}}
  template:
    metadata: {labels: {app: trpc-agent-service, role: admin}}
    spec:
      serviceAccountName: trpc-agent-service
      containers:
        - name: admin
          image: trpc-agent-service:latest
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: trpc-agent-config}
            - secretRef: {name: trpc-agent-control-secrets}
            - secretRef: {name: trpc-agent-admin-secrets}
          env: [{name: TRPC_SERVICE_ROLE, value: admin}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
