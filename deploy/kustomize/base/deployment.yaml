apiVersion: apps/v1
kind: Deployment
metadata: {name: trpc-agent-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent-service, role: gateway}}
  template:
    metadata: {labels: {app: trpc-agent-service, role: gateway}}
    spec:
      serviceAccountName: trpc-agent-service
      containers:
        - name: service
          image: trpc-agent-service:latest
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: trpc-agent-config}
            - secretRef: {name: trpc-agent-runtime-secrets}
            - secretRef: {name: trpc-agent-control-secrets}
          env: [{name: TRPC_SERVICE_ROLE, value: gateway}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trpc-agent-worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent-service, role: worker}}
  template:
    metadata: {labels: {app: trpc-agent-service, role: worker}}
    spec:
      serviceAccountName: trpc-agent-service
      containers:
        - name: worker
          image: trpc-agent-service:latest
          ports: [{name: health, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: trpc-agent-config}
            - secretRef: {name: trpc-agent-runtime-secrets}
          env: [{name: TRPC_SERVICE_ROLE, value: worker}]
          readinessProbe: {httpGet: {path: /health/ready, port: health}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: health}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "4", memory: 4Gi}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: trpc-agent-service}
