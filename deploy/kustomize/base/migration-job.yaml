apiVersion: batch/v1
kind: Job
metadata:
  name: trpc-schema-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trpc-schema-migration
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: trpc-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: trpc-agent-service:latest
          command: ["trpc-service"]
          args: ["migrate", "--revision", "head"]
          envFrom:
            - configMapRef:
                name: trpc-service-config
            - secretRef:
                name: trpc-migration-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: TRPC_MIGRATION_LOCK_TIMEOUT_SECONDS
              value: "30"
            - name: TRPC_MIGRATION_STATEMENT_TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
