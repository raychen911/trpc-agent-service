apiVersion: v1
kind: Service
metadata: {name: trpc-agent-service}
spec:
  selector: {app: trpc-agent-service, role: gateway}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: trpc-agent-admin}
spec:
  selector: {app: trpc-agent-service, role: admin}
  ports: [{name: http, port: 80, targetPort: http}]
