# ===================================================================
# hpa.yaml - Gateway 水平自动扩缩（PRD 5.3 生产推荐口径）
# ===================================================================
# 说明: CPU 70% 阈值；minReplicas=2 保证高可用下限。
#   「每 Pod 100 活跃 session」的自定义指标扩缩需 Prometheus Adapter
#   外部指标支持，作为生产演进项，不在最小清单内。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: teneuris-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teneuris-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ===================================================================
# pdb.yaml - Pod 中断预算（滚动更新/节点维护时保底可用性）
# ===================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: teneuris-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: teneuris-gateway
