apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          lifecycle:
            preStop:
              exec:
                command: ["trpc-service", "drain", "--role", "gateway"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-admin
spec:
  template:
    spec:
      containers:
        - name: admin
          lifecycle:
            preStop:
              exec:
                command: ["trpc-service", "drain", "--role", "admin"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-session-recovery
spec:
  template:
    spec:
      containers:
        - name: session-recovery
          readinessProbe:
            exec:
              command: ["python", "-m", "trpc_service.probe", "--role", "session-recovery"]
          livenessProbe:
            exec:
              command: ["python", "-m", "trpc_service.probe", "--role", "session-recovery", "--liveness"]
          lifecycle:
            preStop:
              exec:
                command: ["trpc-service", "drain", "--role", "session-recovery"]
---
