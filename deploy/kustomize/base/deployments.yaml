apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-backlog-exporter
  labels:
    app.kubernetes.io/name: trpc-backlog-exporter
    app.kubernetes.io/component: backlog-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trpc-backlog-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trpc-backlog-exporter
        app.kubernetes.io/component: backlog-exporter
    spec:
      serviceAccountName: trpc-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backlog-exporter
          image: trpc-agent-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/session_ready_backlog_exporter.py"]
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: TRPC_SERVICE_METRICS_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: trpc-metrics-secrets
                  key: TRPC_SERVICE_METRICS_DATABASE_DSN
            - name: TRPC_BACKLOG_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["python", "-c", "import os, signal; os.kill(1, signal.SIGTERM)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
