apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trpc-agent
resources:
  - ../../base
  - production-hardening.yaml
  - ingress.yaml
  - canary.yaml
patches:
  - path: runtime-security.yaml
images:
  - name: trpc-agent-enterprise
    newName: registry.example.com/trpc-agent-service
    newTag: replace-with-immutable-digest
