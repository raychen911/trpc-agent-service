# Add this file to `patches` in an environment-specific overlay to remove the
# default in-cluster stateful services. Supply PostgreSQL/Redis DSNs through
# the existing application Secrets and replace the two endpoint placeholders.
# This also removes the bundled external-metrics APIService; the managed
# environment must register a provider for `trpc_session_ready_backlog` before
# enabling the worker HPA.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
$patch: delete
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
$patch: delete
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
$patch: delete
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
$patch: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: redis
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: minio
$patch: delete
---
apiVersion: v1
