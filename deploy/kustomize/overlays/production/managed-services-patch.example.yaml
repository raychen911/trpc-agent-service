  name: otel-collector
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
$patch: delete
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-postgres-bootstrap
$patch: delete
---
apiVersion: v1
kind: ConfigMap
