apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-adapter
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trpc-prometheus-adapter-resource-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["extension-apiserver-authentication"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trpc-prometheus-adapter-resource-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trpc-prometheus-adapter-resource-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: trpc-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trpc-prometheus-adapter-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: trpc-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-prometheus-adapter-config
data:
  config.yaml: |
    rules: []
    externalRules:
      - seriesQuery: 'trpc_session_ready_backlog{namespace!=""}'
        resources:
          overrides:
            namespace:
              resource: namespace
        name:
          matches: '^trpc_session_ready_backlog$'
          as: trpc_session_ready_backlog
        metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>}) by (namespace)'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-adapter
        app.kubernetes.io/component: external-metrics
        app.kubernetes.io/part-of: trpc-agent-service
    spec:
      serviceAccountName: prometheus-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: docker.io/zixuan760/trpc-agent-service@sha256:1ba33d7a5b4cdfb960c8824d612a459ff5ef62a15330224d422d36755bc11a11
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=6443
            - --cert-dir=/var/run/serving-cert
            - --prometheus-url=http://prometheus:9090
            - --metrics-relist-interval=15s
            - --metrics-max-age=1m
            - --config=/etc/adapter/config.yaml
          ports:
            - name: https
              containerPort: 6443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
              readOnly: true
            - name: serving-cert
              mountPath: /var/run/serving-cert
      volumes:
        - name: config
          configMap:
            name: trpc-prometheus-adapter-config
        - name: serving-cert
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
spec:
  selector:
    app.kubernetes.io/name: prometheus-adapter
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  group: external.metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: prometheus-adapter
    namespace: trpc-service
    port: 443
  version: v1beta1
  versionPriority: 100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trpc-allow-prometheus-adapter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {port: 6443, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {port: 9090, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
