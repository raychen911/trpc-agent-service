apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-gateway
spec:
  template:
    spec:
      containers:
        - name: gateway
          volumeMounts:
            - name: im-secrets
              mountPath: /run/secrets/im
              readOnly: true
      volumes:
        - name: im-secrets
          secret:
            secretName: trpc-im-secrets
            defaultMode: 288
---
