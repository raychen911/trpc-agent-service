apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trpc-gateway
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - trpc.example.com
      secretName: trpc-gateway-tls
  rules:
    - host: trpc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trpc-gateway
                port:
                  name: http
