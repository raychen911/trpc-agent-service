apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["agent.example.com"]
      secretName: agent-gateway-tls
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-gateway
                port:
                  number: 8080
