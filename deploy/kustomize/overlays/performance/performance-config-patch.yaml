apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-service-config
data:
  TRPC_SERVICE_ENVIRONMENT: test
  TRPC_SERVICE_CAPTURE_CONTENT: "false"
  TRPC_SERVICE_OTLP_ENDPOINT: ""
  TRPC_SERVICE_PROMETHEUS_ENABLED: "false"
  TRPC_SERVICE_S3_ENDPOINT: http://minio.trpc-runtime-support.svc.cluster.local:9000
  TRPC_SERVICE_S3_BUCKET: trpc-artifacts
  # Explicit performance-only settings.  The base and production overlays
  # retain their ordinary worker concurrency and autoscaling values.
  TRPC_PERF_K8S_ENABLED: "true"
  TRPC_PERF_K8S_NAMESPACE: trpc-service
  TRPC_PERF_K8S_GATEWAY_SERVICE: trpc-gateway.trpc-service.svc.cluster.local
  TRPC_PERF_K8S_POSTGRES_SERVICE: postgres.trpc-runtime-support.svc.cluster.local
  TRPC_PERF_K8S_REDIS_SERVICE: redis.trpc-runtime-support.svc.cluster.local
  TRPC_PERF_K8S_GATEWAY_PORT: "8080"
  TRPC_PERF_K8S_POSTGRES_PORT: "5432"
  TRPC_PERF_K8S_REDIS_PORT: "6379"
  TRPC_PERF_K8S_GATEWAY_URL: http://trpc-gateway.trpc-service.svc.cluster.local:8080
  TRPC_PERF_K8S_MAX_INFLIGHT: "64"
  TRPC_PERF_K8S_DB_POOL_SIZE: "32"
  TRPC_PERF_K8S_WORKERS: "4"
  TRPC_PERF_K8S_WORKER_CONCURRENCY: "50"
  TRPC_SERVICE_TENANT_SECRET_ENV_NAMES: '["TRPC_PERF_FIXTURE_UNUSED_APP_SECRET","TRPC_PERF_FIXTURE_UNUSED_VERIFICATION_TOKEN","TRPC_PERF_FIXTURE_UNUSED_ENCRYPT_KEY"]'
  TRPC_PERF_K8S_WORKLOAD_NODE_LABEL: trpc-role=workload
  TRPC_PERF_K8S_GATEWAY_REPLICAS: "4"
  TRPC_PERF_K8S_GATEWAY_DATABASE_POOL_MIN_SIZE: "5"
  TRPC_PERF_K8S_GATEWAY_DATABASE_POOL_MAX_SIZE: "6"
  TRPC_PERF_K8S_WORKER_DATABASE_POOL_MIN_SIZE: "2"
  TRPC_PERF_K8S_WORKER_DATABASE_POOL_MAX_SIZE: "8"
  TRPC_PERF_K8S_WORKER_OFFLINE_AGENT_DELAY_SECONDS: "3.0"
  TRPC_PERF_K8S_OUTBOX_DATABASE_POOL_MIN_SIZE: "2"
  TRPC_PERF_K8S_OUTBOX_DATABASE_POOL_MAX_SIZE: "4"
  TRPC_PERF_K8S_OUTBOX_REPLICAS: "1"
  TRPC_PERF_K8S_RECOVERY_DATABASE_POOL_MIN_SIZE: "1"
  TRPC_PERF_K8S_RECOVERY_DATABASE_POOL_MAX_SIZE: "2"
  TRPC_PERF_K8S_RECOVERY_REPLICAS: "1"
  TRPC_PERF_K8S_RECOVERY_POLL_SECONDS: "1"
  TRPC_PERF_K8S_ESTIMATED_RUNTIME_CONNECTIONS: "97"
  # This is the setting consumed by trpc_service.config.settings.ServiceSettings.
  TRPC_SERVICE_WORKER_CONCURRENCY: "50"
  TRPC_PERF_K8S_RUNNER_NODE_LABEL: trpc-role=load-driver
  TRPC_PERF_K8S_RUNNER_TAINT_KEY: trpc-role
  TRPC_PERF_K8S_RUNNER_TAINT_VALUE: load-driver
  TRPC_PERF_K8S_RUNNER_TAINT_EFFECT: NoSchedule
  TRPC_PERF_K8S_RUNNER_CPU_REQUEST: "2"
  TRPC_PERF_K8S_RUNNER_MEMORY_REQUEST: 2Gi
  TRPC_PERF_K8S_RUNNER_CPU_LIMIT: "4"
  TRPC_PERF_K8S_RUNNER_MEMORY_LIMIT: 4Gi
  TRPC_PERF_K8S_LOAD_DRIVER_NODE_LABEL: trpc-role=load-driver
  TRPC_PERF_K8S_LOAD_DRIVER_TAINT_KEY: trpc-role
  TRPC_PERF_K8S_LOAD_DRIVER_TAINT_VALUE: load-driver
  TRPC_PERF_K8S_LOAD_DRIVER_TAINT_EFFECT: NoSchedule
