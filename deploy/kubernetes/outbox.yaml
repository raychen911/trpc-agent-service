apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-outbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-outbox
  template:
    metadata:
      labels:
        app: agent-outbox
        app.kubernetes.io/part-of: trpc-agent-enterprise
    spec:
      serviceAccountName: agent-runtime
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox
          image: trpc-agent-enterprise:latest
          command: ["python", "-m", "trpc_service.agent.run_outbox"]
          env:
            - name: TRPC_SERVICE_ENVIRONMENT
              value: production
            - name: TRPC_SERVICE_ROLE
              value: outbox
            - name: TRPC_SERVICE_TENANTS_CONFIG
              value: /etc/agent/tenants.yaml
            - name: TRPC_SERVICE_REDIS_URL
              value: redis://redis:6379
            - name: TRPC_SERVICE_MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: mysql-url
            - name: TRPC_SERVICE_TENANT_CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: tenant-config-encryption-key
            - name: TRPC_SERVICE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          envFrom:
            - secretRef:
                name: agent-channel-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/agent
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: agent-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-outbox
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agent-outbox
