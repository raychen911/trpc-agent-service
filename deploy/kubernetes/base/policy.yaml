apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trpc-agent-service-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/component: api}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trpc-agent-service-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8000}]
