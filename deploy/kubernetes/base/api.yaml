apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-service-api
  labels: {app.kubernetes.io/component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/component: api}
    spec:
      serviceAccountName: trpc-agent-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/example/trpc-agent-service
          args: [python, -m, trpc_service._cli, api]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: trpc-agent-service}
          env:
            - name: TRPC_SERVICE_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: trpc-agent-service-secrets, key: TRPC_SERVICE_API_DATABASE_URL}
            - name: TRPC_SERVICE_DATABASE_ROLE
              value: agent_api_gateway
            - name: TRPC_SERVICE_REDIS_URL
              valueFrom:
                secretKeyRef: {name: trpc-agent-service-secrets, key: TRPC_SERVICE_REDIS_URL}
            - name: TRPC_SERVICE_ADMIN_API_KEY
              valueFrom:
                secretKeyRef: {name: trpc-agent-service-secrets, key: TRPC_SERVICE_ADMIN_API_KEY}
            - name: TRPC_SERVICE_TENANT_API_KEYS
              valueFrom:
                secretKeyRef: {name: trpc-agent-service-secrets, key: TRPC_SERVICE_TENANT_API_KEYS, optional: true}
            - name: TRPC_AGENT_API_KEY
              valueFrom:
                secretKeyRef: {name: trpc-agent-service-secrets, key: TRPC_AGENT_API_KEY, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: trpc-agent-service
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/component: api}
  ports: [{name: http, port: 8000, targetPort: http}]
