apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trpc-agent
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - api.yaml
  - worker.yaml
  - dispatcher.yaml
  - wecom-aibot.yaml
  - migration-job.yaml
  - autoscaling.yaml
  - policy.yaml
commonLabels:
  app.kubernetes.io/name: trpc-agent-service
  app.kubernetes.io/part-of: trpc-agent-platform
images:
  - name: ghcr.io/example/trpc-agent-service
    newTag: latest
