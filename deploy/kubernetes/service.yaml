apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-agent-service-env
data:
  TRPC_SERVICE_ENV: production
  TRPC_SERVICE_CONFIG: /etc/trpc-service/tenants.yaml
  TRPC_SERVICE_REDIS_URL: redis://redis:6379/0
  TRPC_SESSION_BACKEND: redis
  TRPC_MEMORY_BACKEND: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-gateway
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent-gateway}}
  template:
    metadata: {labels: {app: trpc-agent-gateway}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: service
          image: trpc-agent-service:0.1.0
          args: ["trpc_service", "serve", "--config", "/etc/trpc-service/tenants.yaml", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef: {name: trpc-agent-service-env}
            - secretRef: {name: trpc-agent-service-secrets}
          env:
            - {name: TRPC_SERVICE_ROLES, value: "gateway"}
            - name: TRPC_AGENT_API_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: model-api-key}}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          volumeMounts: [{name: config, mountPath: /etc/trpc-service, readOnly: true}]
      volumes: [{name: config, configMap: {name: trpc-agent-service-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-worker
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent-worker}}
  template:
    metadata: {labels: {app: trpc-agent-worker}}
    spec:
      terminationGracePeriodSeconds: 180
      containers:
        - name: service
          image: trpc-agent-service:0.1.0
          args: ["trpc_service", "serve", "--config", "/etc/trpc-service/tenants.yaml", "--host", "0.0.0.0", "--port", "8080"]
          envFrom: [{configMapRef: {name: trpc-agent-service-env}}, {secretRef: {name: trpc-agent-service-secrets}}]
          env:
            - {name: TRPC_SERVICE_ROLES, value: "worker"}
            - name: TRPC_AGENT_API_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: model-api-key}}
          ports: [{name: health, containerPort: 8080}]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "4", memory: 4Gi}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5}
          volumeMounts: [{name: config, mountPath: /etc/trpc-service, readOnly: true}]
      volumes: [{name: config, configMap: {name: trpc-agent-service-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-delivery
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent-delivery}}
  template:
    metadata: {labels: {app: trpc-agent-delivery}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: service
          image: trpc-agent-service:0.1.0
          args: ["trpc_service", "serve", "--config", "/etc/trpc-service/tenants.yaml", "--host", "0.0.0.0", "--port", "8080"]
          envFrom: [{configMapRef: {name: trpc-agent-service-env}}, {secretRef: {name: trpc-agent-service-secrets}}]
          env: [{name: TRPC_SERVICE_ROLES, value: "delivery"}]
          ports: [{name: health, containerPort: 8080}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5}
          volumeMounts: [{name: config, mountPath: /etc/trpc-service, readOnly: true}]
      volumes: [{name: config, configMap: {name: trpc-agent-service-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: trpc-agent-gateway}
spec:
  selector: {app: trpc-agent-gateway}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: trpc-agent-gateway}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: trpc-agent-gateway}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: trpc-agent-worker}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: trpc-agent-worker}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
