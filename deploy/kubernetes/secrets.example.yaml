# Do not apply this example with real values committed to Git.
# Create the Secret through External Secrets, Sealed Secrets, or your cloud KMS.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-service-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  # Each DSN authenticates with only the role named by the matching workload.
  # Do not reuse the migrator URL for an API, worker, or dispatcher.
  TRPC_SERVICE_API_DATABASE_URL: postgresql+asyncpg://API_USER:PASSWORD@postgres:5432/trpc_agent
  TRPC_SERVICE_WORKER_DATABASE_URL: postgresql+asyncpg://WORKER_USER:PASSWORD@postgres:5432/trpc_agent
  TRPC_SERVICE_DISPATCHER_DATABASE_URL: postgresql+asyncpg://DISPATCHER_USER:PASSWORD@postgres:5432/trpc_agent
  TRPC_SERVICE_MIGRATOR_DATABASE_URL: postgresql+asyncpg://MIGRATOR_USER:PASSWORD@postgres:5432/trpc_agent
  TRPC_SERVICE_AIBOT_DATABASE_URL: postgresql+asyncpg://AIBOT_USER:PASSWORD@postgres:5432/trpc_agent
  TRPC_SERVICE_REDIS_URL: redis://redis:6379/0
  TRPC_SERVICE_ADMIN_API_KEY: replace-with-secret-manager-reference
  TRPC_SERVICE_TENANT_API_KEYS: '{"tenant-id":"replace-with-tenant-key"}'
  TRPC_AGENT_API_KEY: replace-with-secret-manager-reference
  # Required only when a wecom_aibot binding and singleton gateway are enabled.
  TRPC_LIVE_WECOM_AIBOT_SECRET: '{"bot_id":"replace","secret":"replace"}'
