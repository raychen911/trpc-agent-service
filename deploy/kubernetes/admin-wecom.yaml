# Optional internal Admin and elected WeCom roles; same image as Gateway/Worker.
apiVersion: apps/v1
kind: Deployment
metadata: {name: trpc-agent-admin}
spec:
  replicas: 1
  selector: {matchLabels: {app: trpc-agent-admin}}
  template:
    metadata: {labels: {app: trpc-agent-admin}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: service
          image: trpc-agent-service:0.1.0
          args: ["trpc_service", "serve", "--config", "/etc/trpc-service/tenants.yaml", "--host", "0.0.0.0"]
          envFrom: [{configMapRef: {name: trpc-agent-service-env}}, {secretRef: {name: trpc-agent-service-secrets}}]
          env: [{name: TRPC_SERVICE_ROLES, value: admin}]
          ports: [{name: health, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: config, mountPath: /etc/trpc-service, readOnly: true}]
      volumes: [{name: config, configMap: {name: trpc-agent-service-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: trpc-agent-admin}
spec:
  selector: {app: trpc-agent-admin}
  ports: [{name: http, port: 80, targetPort: health}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trpc-agent-wecom}
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent-wecom}}
  template:
    metadata: {labels: {app: trpc-agent-wecom}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: service
          image: trpc-agent-service:0.1.0
          args: ["trpc_service", "serve", "--config", "/etc/trpc-service/tenants.yaml", "--host", "0.0.0.0"]
          envFrom: [{configMapRef: {name: trpc-agent-service-env}}, {secretRef: {name: trpc-agent-service-secrets}}]
          env: [{name: TRPC_SERVICE_ROLES, value: wecom}]
          ports: [{name: health, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: config, mountPath: /etc/trpc-service, readOnly: true}]
      volumes: [{name: config, configMap: {name: trpc-agent-service-config}}]
