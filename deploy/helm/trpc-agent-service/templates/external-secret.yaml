{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "trpc-agent-service.fullname" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.externalSecret.targetName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.keys.apiDatabaseUrl }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.apiDatabaseUrl }} }
    - secretKey: {{ .Values.secrets.keys.workerDatabaseUrl }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.workerDatabaseUrl }} }
    - secretKey: {{ .Values.secrets.keys.dispatcherDatabaseUrl }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.dispatcherDatabaseUrl }} }
    - secretKey: {{ .Values.secrets.keys.migratorDatabaseUrl }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.migratorDatabaseUrl }} }
    - secretKey: {{ .Values.secrets.keys.aibotDatabaseUrl }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.aibotDatabaseUrl }} }
    - secretKey: {{ .Values.secrets.keys.adminApiKey }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.adminApiKey }} }
    - secretKey: {{ .Values.secrets.keys.tenantApiKeys }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.tenantApiKeys }} }
    - secretKey: {{ .Values.secrets.keys.redisUrl }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.redisUrl }}}
    - secretKey: {{ .Values.secrets.keys.agentApiKey }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.agentApiKey }}}
    {{- if .Values.wecomAibot.enabled }}
    - secretKey: {{ .Values.secrets.keys.wecomAibotSecret }}
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.wecomAibotSecret }}}
    {{- end }}
{{- end }}
