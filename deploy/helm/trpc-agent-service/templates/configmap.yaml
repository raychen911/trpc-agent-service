apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trpc-agent-service.fullname" . }}
  labels:
    {{- include "trpc-agent-service.labels" . | nindent 4 }}
data:
  TRPC_SERVICE_ENVIRONMENT: {{ .Values.config.environment | quote }}
  TRPC_SERVICE_RUNTIME_BACKEND: {{ .Values.config.runtimeBackend | quote }}
  TRPC_SERVICE_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TRPC_SERVICE_OTEL_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  TRPC_SERVICE_STORAGE_PROFILE_ROOT: {{ .Values.storageProfiles.mountPath | quote }}
