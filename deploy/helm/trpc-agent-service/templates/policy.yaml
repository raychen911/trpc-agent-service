apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trpc-agent-service.fullname" . }}-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "trpc-agent-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trpc-agent-service.fullname" . }}-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      {{- include "trpc-agent-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
