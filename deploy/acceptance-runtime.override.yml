# Safety envelope for every real acceptance Compose stack.
#
# This file is intentionally opt-in.  Keep the ordinary docker-compose.yml
# defaults unchanged for development and production-like local operation; all
# acceptance commands must add this file after the base Compose file (and any
# scenario-specific override).  In particular, restart=no prevents Docker
# Desktop from reviving a killed acceptance process after a host restart.

x-acceptance-defaults: &acceptance-defaults
  restart: "no"
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *acceptance-defaults
    pids_limit: 128
    deploy:
      resources:
        limits:
          pids: 128
          cpus: "0.50"
          memory: 512M
  gateway:
    <<: *acceptance-defaults
    deploy:
      resources:
        limits:
          pids: 256
          cpus: "2.00"
          memory: 768M
  admin:
    <<: *acceptance-defaults
    deploy:
      resources:
        limits:
          pids: 256
          cpus: "0.50"
          memory: 512M
  worker:
    <<: *acceptance-defaults
    deploy:
      resources:
        limits:
          pids: 256
          cpus: "1.00"
          memory: 1G
  outbox-dispatcher:
