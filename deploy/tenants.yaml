tenants:
  - tenant_id: local_demo
    name: Local Demo
    model:
      provider: openai-compatible
      model_name: deepseek-chat
      api_endpoint: https://api.deepseek.com
      timeout: 30
      retry: 2
    app_config:
      default_instruction: You are a helpful local multi-tenant agent.
    channel_configs:
      wecom:
        channel_type: wecom
        token: ${WECOM_TOKEN}
        secret: ${WECOM_CORP_SECRET}
        aes_key: ${WECOM_AES_KEY}
        corp_id: local-corp
        agent_id: "1000001"
      wechat_kf:
        channel_type: wechat_kf
        token: ${WECHAT_KF_TOKEN}
        aes_key: ${WECHAT_KF_AES_KEY}
        corp_id: local-corp
        open_kfid: wk-local
      dingtalk:
        channel_type: dingtalk
        app_id: local-dingtalk-app
        robot_code: local-robot
        secret: ${DINGTALK_SECRET}
      feishu:
        channel_type: feishu
        app_id: local-feishu-app
        verification_token: ${FEISHU_VERIFICATION_TOKEN}
        encrypt_key: ${FEISHU_ENCRYPT_KEY}
      qq:
        channel_type: qq
        app_id: ${QQBOT_APP_ID}
        secret: ${QQBOT_APP_SECRET}

    storage_config:
      session_backend: redis
      memory_backend: redis
      summary_backend: redis
      audit_backend: mysql
      redis_url: redis://redis:6379/0
      mysql_url: mysql+aiomysql://agent:agent_local@mysql:3306/trpc_agent
      vector:
        backend: memory
        collection: local_demo_knowledge
      object:
        backend: local
        local_path: /app/data/objects
        bucket: local-artifacts
    audit_policy:
      enabled: true
      retention_days: 30
