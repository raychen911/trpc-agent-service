apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  TRPC_SERVICE_DATABASE_URL: postgresql+asyncpg://trpc_agent:replace-me@postgres:5432/trpc_agent
  TRPC_QUEUE_REDIS_URL: redis://redis:6379/0
  TRPC_REDIS_URL: redis://redis:6379/1
  TRPC_AGENT_API_KEY: replace-me
  TRPC_SERVICE_ADMIN_API_KEY: replace-me
  TRPC_SERVICE_SESSION_HMAC_KEY: replace-with-at-least-16-characters
  TRPC_DEMO_TENANT_API_KEY: replace-me
  TRPC_TELEGRAM_BOT_TOKEN: replace-me
  TRPC_WECOM_BOT_SECRET: replace-me
