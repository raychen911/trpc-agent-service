apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-agent-config
  namespace: trpc-agent
data:
  TRPC_REDIS_URL: redis://redis:6379
  TRPC_S3_ENDPOINT: minio:9000
  TRPC_S3_BUCKET: trpc-artifacts
  TRPC_MODEL_PROVIDER: openai-compatible
  TRPC_MODEL_NAME: deepseek-chat
  TRPC_MODEL_BASE_URL: https://api.deepseek.com/v1
  TRPC_TRACE_ENABLED: "true"
  TRPC_TRACE_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: trpc-agent
data:
  config.yaml: |
    extensions:
      health_check: {}
    receivers:
      otlp:
        protocols:
          http: {}
    exporters:
      debug: {}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
      batch: {}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
