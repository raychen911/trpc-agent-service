apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: trpc-agent
spec:
  selector: {app: gateway}
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: trpc-agent
spec:
  # One replica owns IM long connections. Scale HTTP ingress only after using
  # platform-specific single-consumer coordination.
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: trpc-agent-service:local
          args: [gateway, --host, 0.0.0.0, --port, "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: trpc-agent-config}}]
          env:
            - name: TRPC_DATABASE_URL
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_DATABASE_URL}}
            - name: TRPC_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_INTERNAL_TOKEN}}
            - name: TRPC_WORKER_BASE_URLS
              value: http://worker:8001
          readinessProbe: {httpGet: {path: /health, port: http}}
          livenessProbe: {httpGet: {path: /health, port: http}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
