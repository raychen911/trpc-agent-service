apiVersion: v1
kind: Service
metadata:
  name: agent-gateway
  namespace: trpc-agent
spec:
  selector:
    app: agent-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-gateway
  namespace: trpc-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-gateway
  template:
    metadata:
      labels:
        app: agent-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U trpc_agent; do sleep 2; done"]
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h redis ping; do sleep 2; done"]
      containers:
        - name: gateway
          image: trpc-agent-service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "trpc_service._cli", "serve"]
          envFrom:
            - configMapRef:
                name: trpc-agent-config
            - secretRef:
                name: trpc-agent-secrets
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
