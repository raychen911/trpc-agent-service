apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: trpc-agent
spec:
  selector: {app: worker}
  ports:
    - port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: trpc-agent
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: trpc-agent-service:local
          args: [worker, --host, 0.0.0.0, --port, "8001"]
          ports: [{name: http, containerPort: 8001}]
          envFrom: [{configMapRef: {name: trpc-agent-config}}]
          env:
            - name: TRPC_DATABASE_URL
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_DATABASE_URL}}
            - name: TRPC_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_INTERNAL_TOKEN}}
            - name: TRPC_MODEL_API_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_MODEL_API_KEY}}
            - name: TRPC_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_S3_ACCESS_KEY}}
            - name: TRPC_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_S3_SECRET_KEY}}
          readinessProbe: {httpGet: {path: /health, port: http}}
          livenessProbe: {httpGet: {path: /health, port: http}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
