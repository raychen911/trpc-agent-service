apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: trpc-agent
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: trpc-agent
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data]
          ports:
            - name: minio
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_S3_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: TRPC_S3_SECRET_KEY}}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: minio}}
          livenessProbe: {httpGet: {path: /minio/health/live, port: minio}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
