[mypy]
python_version = 3.12
strict = True
explicit_package_bases = True
warn_unused_configs = True
allow_subclassing_any = True
exclude = migrations

[mypy-redis]
ignore_missing_imports = True

[mypy-psycopg]
ignore_missing_imports = True

[mypy-boto3]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-trpc_agent_sdk.*]
ignore_missing_imports = True
